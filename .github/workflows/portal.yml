name: Build developer documentation portal

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - documentation-updated

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portal
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Test custom portal logic
        run: npm test

      - name: Validate project registry and sources
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run docs:validate

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --no-install vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production output
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --no-install vercel build --prod --token="$VERCEL_TOKEN"

      - name: Typecheck synchronized portal
        run: npm run typecheck

      - name: Verify prebuilt deployment output
        shell: bash
        run: |
          test -d .vercel/output
          test -n "$(find .vercel/output -type f -print -quit)"
          if rg --hidden --no-messages -a -l \
            -e 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY' \
            -e 'DOCS_APP_PRIVATE_KEY' \
            .vercel/output; then
            echo "Deployment output contains credential material."
            exit 1
          fi

      - name: Upload Vercel deployment output
        uses: actions/upload-artifact@v7
        with:
          name: developer-portal-vercel-output
          path: .vercel/output/
          if-no-files-found: error

      - name: Deploy prebuilt Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --no-install vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
